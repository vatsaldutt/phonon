<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fan Control</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #080b12;
    --surface:   #0e1320;
    --border:    #1c2438;
    --text:      #d8dde8;
    --dim:       #4a5470;
    --accent:    #4a8fff;
    --accent-glow: rgba(74,143,255,0.18);
    --on:        #22d3a0;
    --on-glow:   rgba(34,211,160,0.15);
    --warm:      #ff9a3c;
    --cool:      #9dd5ff;
    --fan-blade: #1e2840;
    --fan-hub:   #2a3555;
    --radius:    14px;
    --mono:      'JetBrains Mono', monospace;
    --sans:      'Inter', system-ui, sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 64px;
    gap: 0;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(74,143,255,0.06) 0%, transparent 70%);
  }

  /* ── Header ─────────────────────────────────────────────── */
  header {
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 36px;
  }

  .logo {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 500;
    color: var(--dim);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 5px 12px;
    border-radius: 99px;
    transition: color 0.3s;
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--dim);
    transition: background 0.3s, box-shadow 0.3s;
  }

  .status-pill.connected { color: var(--on); }
  .status-pill.connected .status-dot {
    background: var(--on);
    box-shadow: 0 0 8px var(--on);
  }
  .status-pill.error { color: #ff5f6e; }
  .status-pill.error .status-dot { background: #ff5f6e; }

  /* ── Fan visualization ───────────────────────────────────── */
  .fan-viz-wrap {
    width: 180px; height: 180px;
    position: relative;
    margin-bottom: 32px;
  }

  #fan-svg {
    width: 100%; height: 100%;
    overflow: visible;
  }

  .fan-ring {
    fill: none;
    stroke: var(--border);
    stroke-width: 2;
  }

  .fan-ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-dasharray: 502;
    stroke-dashoffset: 502;
    transition: stroke-dashoffset 0.6s cubic-bezier(0.4,0,0.2,1),
                stroke 0.4s;
    filter: drop-shadow(0 0 6px var(--accent));
    transform: rotate(-90deg);
    transform-origin: center;
  }

  .fan-ring-progress.off {
    stroke: var(--dim);
    filter: none;
  }

  #fan-blades {
    transform-origin: 90px 90px;
    /* animation-play-state controlled by JS */
  }

  .blade {
    fill: var(--fan-blade);
    stroke: #2a3a5c;
    stroke-width: 0.5;
  }

  .hub-outer { fill: var(--fan-hub); }
  .hub-inner { fill: #1a2035; }

  .fan-speed-label {
    text-align: center;
    font-family: var(--mono);
    font-size: 32px;
    font-weight: 500;
    color: var(--text);
    line-height: 1;
    letter-spacing: -0.02em;
    transition: color 0.3s;
  }

  .fan-speed-label.off { color: var(--dim); }

  .fan-speed-unit {
    font-size: 13px;
    color: var(--dim);
    font-family: var(--mono);
    margin-top: 2px;
    text-align: center;
  }

  /* ── Cards ───────────────────────────────────────────────── */
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  .card-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dim);
  }

  /* ── Toggle (on/off switch) ──────────────────────────────── */
  .toggle {
    position: relative;
    width: 48px; height: 26px;
    cursor: pointer;
  }

  .toggle input { display: none; }

  .toggle-track {
    position: absolute;
    inset: 0;
    background: var(--border);
    border-radius: 99px;
    transition: background 0.25s, box-shadow 0.25s;
  }

  .toggle-thumb {
    position: absolute;
    top: 3px; left: 3px;
    width: 20px; height: 20px;
    background: var(--dim);
    border-radius: 50%;
    transition: transform 0.25s cubic-bezier(0.4,0,0.2,1), background 0.25s;
  }

  .toggle input:checked ~ .toggle-track {
    background: var(--on);
    box-shadow: 0 0 12px var(--on-glow);
  }

  .toggle input:checked ~ .toggle-thumb {
    transform: translateX(22px);
    background: #fff;
  }

  /* ── Sliders ─────────────────────────────────────────────── */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 8px;
  }

  .slider-label {
    font-size: 12px;
    color: var(--dim);
    min-width: 56px;
  }

  .slider-value {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    min-width: 44px;
    text-align: right;
    white-space: nowrap;
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
    background: var(--border);
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--text);
    box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--accent);
    transition: box-shadow 0.15s;
    cursor: grab;
  }

  input[type=range]:active::-webkit-slider-thumb { cursor: grabbing; }

  #speed-slider {
    background: linear-gradient(to right, var(--accent) var(--pct, 0%), var(--border) var(--pct, 0%));
  }

  #brightness-slider {
    background: linear-gradient(to right, #fff3 var(--pct, 0%), var(--border) var(--pct, 0%));
  }

  #brightness-slider::-webkit-slider-thumb {
    box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px rgba(255,255,255,0.5);
  }

  /* Colour-temperature slider */
  #ct-slider {
    background: linear-gradient(to right, var(--warm), var(--cool));
    height: 6px;
    border-radius: 3px;
  }

  #ct-slider::-webkit-slider-thumb {
    box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px rgba(255,255,255,0.6);
  }

  .ct-endpoints {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 11px;
  }

  .ct-warm { color: var(--warm); }
  .ct-cool { color: var(--cool); }

  /* ── Swatch ──────────────────────────────────────────────── */
  .light-swatch {
    width: 100%;
    height: 8px;
    border-radius: 4px;
    margin-top: 20px;
    transition: background 0.4s, box-shadow 0.4s;
    background: transparent;
  }

  /* ── Divider ─────────────────────────────────────────────── */
  .divider {
    width: 100%;
    height: 1px;
    background: var(--border);
    margin: 20px 0;
  }

  /* ── Preset buttons ──────────────────────────────────────── */
  .presets {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 6px;
  }

  .preset-btn {
    font-size: 12px;
    font-weight: 500;
    font-family: var(--sans);
    color: var(--dim);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
    white-space: nowrap;
  }

  .preset-btn:hover {
    color: var(--text);
    border-color: var(--accent);
    background: var(--accent-glow);
  }

  /* ── Error toast ─────────────────────────────────────────── */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #2a1520;
    border: 1px solid #5a2030;
    color: #ff8090;
    font-size: 13px;
    padding: 11px 20px;
    border-radius: 10px;
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.3s;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    z-index: 100;
  }

  #toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* ── Responsive ──────────────────────────────────────────── */
  @media (max-width: 480px) {
    .fan-viz-wrap { width: 150px; height: 150px; }
    #fan-svg { /* viewBox handles scaling */ }
  }

  @media (prefers-reduced-motion: reduce) {
    #fan-blades { animation: none !important; }
  }
</style>
</head>
<body>

<header>
  <span class="logo">Crystal / Fan</span>
  <div class="status-pill" id="status-pill">
    <span class="status-dot"></span>
    <span id="status-text">connecting</span>
  </div>
</header>

<!-- Fan visualization -->
<div class="fan-viz-wrap">
  <svg id="fan-svg" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
    <!-- Background ring -->
    <circle class="fan-ring" cx="90" cy="90" r="80"/>
    <!-- Progress arc -->
    <circle class="fan-ring-progress off" id="arc" cx="90" cy="90" r="80"/>

    <!-- Spinning blades -->
    <g id="fan-blades">
      <!-- 4 blades at 0, 90, 180, 270 degrees -->
      <!-- Blade 1 -->
      <ellipse class="blade" cx="90" cy="58" rx="10" ry="28" transform="rotate(0 90 90)"/>
      <!-- Blade 2 -->
      <ellipse class="blade" cx="90" cy="58" rx="10" ry="28" transform="rotate(90 90 90)"/>
      <!-- Blade 3 -->
      <ellipse class="blade" cx="90" cy="58" rx="10" ry="28" transform="rotate(180 90 90)"/>
      <!-- Blade 4 -->
      <ellipse class="blade" cx="90" cy="58" rx="10" ry="28" transform="rotate(270 90 90)"/>
      <!-- Hub -->
      <circle class="hub-outer" cx="90" cy="90" r="14"/>
      <circle class="hub-inner" cx="90" cy="90" r="8"/>
    </g>
  </svg>
</div>

<div class="fan-speed-label off" id="speed-display">0</div>
<div class="fan-speed-unit">% speed</div>

<br>

<!-- Fan card -->
<div class="card">
  <div class="card-header">
    <span class="card-title">Fan</span>
    <label class="toggle" title="Fan on/off">
      <input type="checkbox" id="fan-toggle">
      <span class="toggle-track"></span>
      <span class="toggle-thumb"></span>
    </label>
  </div>

  <div class="slider-row">
    <span class="slider-label">Speed</span>
    <input type="range" id="speed-slider" min="0" max="100" value="0">
    <span class="slider-value" id="speed-val">0%</span>
  </div>

  <div class="divider"></div>

  <div class="presets">
    <button class="preset-btn" data-speed="25">Low</button>
    <button class="preset-btn" data-speed="50">Medium</button>
    <button class="preset-btn" data-speed="75">High</button>
    <button class="preset-btn" data-speed="100">Max</button>
  </div>
</div>

<!-- Light card -->
<div class="card">
  <div class="card-header">
    <span class="card-title">Light</span>
    <label class="toggle" title="Light on/off">
      <input type="checkbox" id="light-toggle">
      <span class="toggle-track"></span>
      <span class="toggle-thumb"></span>
    </label>
  </div>

  <div class="slider-row">
    <span class="slider-label">Brightness</span>
    <input type="range" id="brightness-slider" min="1" max="100" value="100">
    <span class="slider-value" id="brightness-val">100%</span>
  </div>

  <div class="divider"></div>

  <div class="slider-row">
    <span class="slider-label" style="color:var(--dim)">Color</span>
    <input type="range" id="ct-slider" min="2700" max="6500" value="2700">
    <span class="slider-value" id="ct-val" style="color:var(--warm)">2700K</span>
  </div>
  <div class="ct-endpoints">
    <span class="ct-warm">Warm 2700K</span>
    <span class="ct-cool">Cool 6500K</span>
  </div>

  <!-- Live colour swatch -->
  <div class="light-swatch" id="swatch"></div>

  <div class="divider"></div>

  <div class="presets">
    <button class="preset-btn" data-bri="100" data-ct="2700">Warm</button>
    <button class="preset-btn" data-bri="80"  data-ct="3500">Neutral</button>
    <button class="preset-btn" data-bri="100" data-ct="6500">Bright</button>
    <button class="preset-btn" data-bri="20"  data-ct="2700">Night</button>
  </div>
</div>

<div id="toast"></div>

<style>
  /* Fan spin animation — JS sets --rpm as a CSS variable on #fan-blades */
  @keyframes spin { to { transform: rotate(360deg); } }
  #fan-blades { transform-origin: 90px 90px; }
</style>

<script>
const API = 'https://api.vatsaldutt.com';
const POLL_MS = 5000;

// ── State ──────────────────────────────────────────────────────────────────
let fanOn  = false;
let fanPct = 0;
let lightOn = false;
let lightBri = 100;
let lightCT  = 2700;

let _fanDebounce   = null;
let _briDebounce   = null;
let _ctDebounce    = null;
let _bladeAnimId   = null;
let _currentRpm    = 0;
let _targetRpm     = 0;

// ── DOM refs ───────────────────────────────────────────────────────────────
const pill        = document.getElementById('status-pill');
const statusText  = document.getElementById('status-text');
const arc         = document.getElementById('arc');
const blades      = document.getElementById('fan-blades');
const speedDisp   = document.getElementById('speed-display');
const speedSlider = document.getElementById('speed-slider');
const speedVal    = document.getElementById('speed-val');
const fanToggle   = document.getElementById('fan-toggle');
const lightToggle = document.getElementById('light-toggle');
const briSlider   = document.getElementById('brightness-slider');
const briVal      = document.getElementById('brightness-val');
const ctSlider    = document.getElementById('ct-slider');
const ctVal       = document.getElementById('ct-val');
const swatch      = document.getElementById('swatch');
const toast       = document.getElementById('toast');

// ── Toast ──────────────────────────────────────────────────────────────────
let _toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
}

// ── API helpers ────────────────────────────────────────────────────────────
async function apiFetch(path, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
}

// ── Status indicator ───────────────────────────────────────────────────────
function setStatus(state) {
  pill.className = 'status-pill ' + state;
  statusText.textContent = state === 'connected' ? 'connected'
                         : state === 'error'     ? 'offline'
                         : 'connecting';
}

// ── Fan visualization ──────────────────────────────────────────────────────
const ARC_CIRC = 2 * Math.PI * 80; // ≈ 502.65

function updateArc(pct, on) {
  const offset = ARC_CIRC * (1 - pct / 100);
  arc.style.strokeDashoffset = offset;
  if (on && pct > 0) {
    arc.classList.remove('off');
  } else {
    arc.classList.add('off');
  }
}

// Smooth blade spin via requestAnimationFrame
let _lastTs = null;
let _angle = 0;

function animateBlades(ts) {
  if (_lastTs === null) _lastTs = ts;
  const dt = (ts - _lastTs) / 1000;
  _lastTs = ts;

  // Ease current RPM toward target
  const diff = _targetRpm - _currentRpm;
  _currentRpm += diff * Math.min(dt * 2, 1);

  _angle = (_angle + _currentRpm * 360 / 60 * dt) % 360;
  blades.style.transform = `rotate(${_angle}deg)`;

  _bladeAnimId = requestAnimationFrame(animateBlades);
}

function setFanRpm(pct, on) {
  // Map 0-100% speed to 0-180 RPM for visual effect
  _targetRpm = on && pct > 0 ? (pct / 100) * 180 : 0;
}

// ── Apply state to UI (no API call) ───────────────────────────────────────
function applyFanState(on, pct) {
  fanOn  = on;
  fanPct = pct;

  fanToggle.checked = on;

  const displayPct = on ? pct : 0;
  speedSlider.value = displayPct;
  updateSliderFill(speedSlider, displayPct);
  speedVal.textContent = displayPct + '%';
  speedDisp.textContent = displayPct;
  speedDisp.className = 'fan-speed-label' + (on && pct > 0 ? '' : ' off');

  updateArc(displayPct, on);
  setFanRpm(displayPct, on);
}

function applyLightState(on, bri, ct) {
  lightOn  = on;
  lightBri = bri ?? lightBri;
  lightCT  = ct  ?? lightCT;

  lightToggle.checked = on;
  briSlider.value = lightBri;
  ctSlider.value  = lightCT;
  briVal.textContent = lightBri + '%';
  updateSliderFill(briSlider, lightBri);
  updateCTDisplay(lightCT);
  updateSwatch(lightCT, on);
}

// ── Slider fill helpers ────────────────────────────────────────────────────
function updateSliderFill(el, pct) {
  const min = +el.min, max = +el.max;
  const frac = (pct - min) / (max - min) * 100;
  el.style.setProperty('--pct', frac + '%');
}

// ── CT colour helpers ──────────────────────────────────────────────────────
function kelvinToHex(k) {
  const t = (k - 2700) / (6500 - 2700);
  const r = Math.round(0xff + (0xc5 - 0xff) * t);
  const g = Math.round(0xc0 + (0xe8 - 0xc0) * t);
  const b = Math.round(0x4d + (0xff - 0x4d) * t);
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

function updateCTDisplay(k) {
  const hex = kelvinToHex(k);
  ctVal.textContent = k + 'K';
  ctVal.style.color = hex;
}

function updateSwatch(k, on) {
  if (!on) {
    swatch.style.background = 'transparent';
    swatch.style.boxShadow = 'none';
    return;
  }
  const hex = kelvinToHex(k);
  swatch.style.background = hex;
  swatch.style.boxShadow = `0 0 16px ${hex}88`;
}

// ── Poll state ─────────────────────────────────────────────────────────────
async function pollState() {
  try {
    const [fs, ls] = await Promise.all([
      apiFetch('/fan/state'),
      apiFetch('/fan/light/state'),
    ]);

    setStatus('connected');

    const on  = fs.state === 'on';
    const pct = fs.attributes?.percentage ?? 0;

    // Only sync sliders if user isn't dragging (no pending debounce)
    if (!_fanDebounce) applyFanState(on, pct);

    const lon  = ls.state === 'on';
    const bri  = ls.attributes?.brightness != null
      ? Math.round(ls.attributes.brightness / 255 * 100) : lightBri;
    const ct   = ls.attributes?.color_temp_kelvin ?? lightCT;

    if (!_briDebounce && !_ctDebounce) applyLightState(lon, bri, ct);

  } catch (e) {
    setStatus('error');
    showToast('Cannot reach API — check connection');
  }
}

// ── Fan toggle ─────────────────────────────────────────────────────────────
fanToggle.addEventListener('change', async () => {
  const on = fanToggle.checked;
  applyFanState(on, fanPct);
  try {
    await apiFetch(on ? '/fan/on' : '/fan/off', 'POST');
  } catch (e) {
    showToast('Fan toggle failed');
    applyFanState(!on, fanPct); // revert
  }
});

// ── Speed slider ───────────────────────────────────────────────────────────
speedSlider.addEventListener('input', () => {
  const pct = +speedSlider.value;
  speedVal.textContent = pct + '%';
  speedDisp.textContent = pct;
  speedDisp.className = 'fan-speed-label' + (pct > 0 ? '' : ' off');
  updateSliderFill(speedSlider, pct);
  updateArc(pct, true);
  setFanRpm(pct, true);

  clearTimeout(_fanDebounce);
  _fanDebounce = setTimeout(async () => {
    try {
      if (pct === 0) {
        await apiFetch('/fan/off', 'POST');
        fanToggle.checked = false;
        fanOn = false;
      } else {
        if (!fanOn) { await apiFetch('/fan/on', 'POST'); fanToggle.checked = true; fanOn = true; }
        await apiFetch('/fan/speed', 'POST', { percentage: pct });
      }
    } catch (e) { showToast('Speed update failed'); }
    _fanDebounce = null;
  }, 350);
});

// ── Speed presets ──────────────────────────────────────────────────────────
document.querySelectorAll('.preset-btn[data-speed]').forEach(btn => {
  btn.addEventListener('click', async () => {
    const pct = +btn.dataset.speed;
    applyFanState(true, pct);
    try {
      if (!fanOn) await apiFetch('/fan/on', 'POST');
      await apiFetch('/fan/speed', 'POST', { percentage: pct });
    } catch (e) { showToast('Preset failed'); }
  });
});

// ── Light toggle ───────────────────────────────────────────────────────────
lightToggle.addEventListener('change', async () => {
  const on = lightToggle.checked;
  applyLightState(on, lightBri, lightCT);
  try {
    if (on) await apiFetch('/fan/light/on', 'POST', {});
    else    await apiFetch('/fan/light/off', 'POST');
  } catch (e) {
    showToast('Light toggle failed');
    applyLightState(!on, lightBri, lightCT);
  }
});

// ── Brightness slider ──────────────────────────────────────────────────────
briSlider.addEventListener('input', () => {
  const v = +briSlider.value;
  briVal.textContent = v + '%';
  lightBri = v;
  updateSliderFill(briSlider, v);

  clearTimeout(_briDebounce);
  _briDebounce = setTimeout(async () => {
    try {
      await apiFetch('/fan/light/on', 'POST', { brightness_pct: v });
      if (!lightOn) { lightToggle.checked = true; lightOn = true; }
    } catch (e) { showToast('Brightness update failed'); }
    _briDebounce = null;
  }, 350);
});

// ── CT slider ──────────────────────────────────────────────────────────────
ctSlider.addEventListener('input', () => {
  const k = +ctSlider.value;
  lightCT = k;
  updateCTDisplay(k);
  updateSwatch(k, lightOn);

  clearTimeout(_ctDebounce);
  _ctDebounce = setTimeout(async () => {
    try {
      await apiFetch('/fan/light/on', 'POST', { color_temp_kelvin: k });
      if (!lightOn) { lightToggle.checked = true; lightOn = true; }
    } catch (e) { showToast('Color temp update failed'); }
    _ctDebounce = null;
  }, 350);
});

// ── Light presets ──────────────────────────────────────────────────────────
document.querySelectorAll('.preset-btn[data-bri]').forEach(btn => {
  btn.addEventListener('click', async () => {
    const bri = +btn.dataset.bri;
    const ct  = +btn.dataset.ct;
    applyLightState(true, bri, ct);
    try {
      await apiFetch('/fan/light/on', 'POST', { brightness_pct: bri, color_temp_kelvin: ct });
    } catch (e) { showToast('Preset failed'); }
  });
});

// ── Boot ───────────────────────────────────────────────────────────────────
requestAnimationFrame(animateBlades);
pollState();
setInterval(pollState, POLL_MS);
</script>
</body>
</html>
